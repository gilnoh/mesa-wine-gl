[binaries]
c = ['/usr/local/opt/llvm/bin/clang', '--no-default-config', '-arch', 'x86_64']
cpp = ['/usr/local/opt/llvm/bin/clang++', '--no-default-config', '-arch', 'x86_64']
objc = ['/usr/local/opt/llvm/bin/clang', '--no-default-config', '-arch', 'x86_64']
ar = '/usr/local/opt/llvm/bin/llvm-ar'
strip = '/usr/local/opt/llvm/bin/llvm-strip'
ranlib = '/usr/local/opt/llvm/bin/llvm-ranlib'
pkg-config = '/usr/local/bin/pkg-config'
llvm-config = '/usr/local/opt/llvm/bin/llvm-config'

[built-in options]
c_link_args = ['-arch', 'x86_64', '-L/usr/local/opt/llvm/lib']
cpp_link_args = ['-arch', 'x86_64', '-L/usr/local/opt/llvm/lib']
objc_link_args = ['-arch', 'x86_64', '-L/usr/local/opt/llvm/lib']
